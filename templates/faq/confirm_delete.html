{% extends 'base.html' %}
{% block title %}Удаление статьи{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-danger">
                <div class="card-header bg-transparent text-danger">
                    <h4>Подтверждение удаления</h4>
                </div>
                <div class="card-body">
                    <p>Вы действительно хотите удалить статью <strong>"{{ article.title }}"</strong>?</p>
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Да, удалить</button>
                        <a href="{% url 'faq:manage' %}" class="btn btn-secondary">Отмена</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
